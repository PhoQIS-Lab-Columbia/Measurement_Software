[project]
name = "phoqis_measurement_instruments"
version = "1.0.0"
authors = [
  { name="Mary Grace D Avanzo", email="mgdavanzo26@gmail.com" },
]
description = "A package to control PhoQis Labs various pieces of measurement equipment."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/phoqis-lab/Measurement_Software"
Issues = "https://github.com/phoqis-lab/Measurement_Software/Issues"

[tool.setuptools.package-data]